name: Contract & CI Conformance Tests

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: service/package-lock.json

      - name: Install Dependencies
        run: |
          cd service
          npm ci

      - name: Initialize Environment & SQLite Database
        run: |
          cd service
          cp .env.example .env
          npm run db:init

      - name: Run Full Test Suite (Unit, Idempotency & Contract)
        run: |
          cd service
          npm test

      - name: Run Contract Conformance Tests
        run: |
          cd service
          npm run test:contract
